<aside class="sidebar bg-dark text-light border-end border-secondary" [class.collapsed]="collapsed">
  
  <!-- Sidebar Navigation List -->
  <div class="sidebar-scroll py-3">
    
    <ul class="nav nav-pills flex-column px-2 gap-1">
      
      @for (item of menuItems; track item.module) {
        <li class="nav-item">
          <a class="nav-link text-light d-flex align-items-center gap-3 py-2.5 rounded-3 border-0"
             [routerLink]="item.route ? item.route : [dashboardPath]"
             [queryParams]="item.route ? {} : { module: item.module }"
             [class.active]="item.route ? false : (activeModule === item.module)"
             [title]="item.label">
            <i class="bi" [ngClass]="item.icon"></i>
            <span class="sidebar-text">{{ item.label }}</span>
          </a>
        </li>
      }
      
    </ul>

  </div>

  <!-- Collapsible Toggle indicator on lower edge -->
  <div class="sidebar-footer px-3 py-3 border-top border-secondary text-center">
    @if (!collapsed) {
      <small class="text-muted d-block opacity-75">BuildTrack v1.0.0</small>
    } @else {
      <i class="bi bi-info-circle text-muted fs-6"></i>
    }
  </div>

</aside>
